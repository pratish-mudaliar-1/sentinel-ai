<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geo Analytics | Sentinel Core</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --bg: #000;
            --panel: rgba(10, 10, 15, 0.8);
            --accent: #ff4d00;
            --danger: #ff0000;
            --text: #e0e0e0;
            --border: rgba(255, 77, 0, 0.3);
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 20px;
            overflow: hidden;
        }

        .geo-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            grid-template-rows: 600px 300px;
            gap: 20px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 30px rgba(255, 77, 0, 0.1);
        }

        .map-card {
            grid-column: 1 / 2;
            grid-row: 1 / 3;
            position: relative;
            overflow: hidden;
            background: #000;
        }

        #map {
            width: 100%;
            height: 100%;
            border-radius: 12px;
            background: #000;
        }

        .leaflet-heatmap-layer {
            filter: contrast(35) brightness(1.2) saturate(2) blur(3px);
            mix-blend-mode: screen;
        }

        .leaflet-container {
            background: #000 !important;
        }

        .leaflet-tile-pane {
            filter: brightness(0.7) contrast(1.1) saturate(0.8);
            opacity: 1;
        }

        .stats-card {
            grid-column: 2 / 3;
            grid-row: 1 / 2;
        }

        .graph-card {
            grid-column: 2 / 3;
            grid-row: 2 / 3;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            z-index: 1000;
        }

        .title {
            color: var(--accent);
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            background: rgba(255, 77, 0, 0.1);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.5);
                opacity: 0.5;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .threat-list {
            flex: 1;
            overflow-y: auto;
            margin-top: 10px;
            padding-right: 5px;
        }

        .threat-item {
            background: rgba(255, 77, 0, 0.05);
            border-left: 4px solid var(--accent);
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .threat-item:hover {
            background: rgba(255, 77, 0, 0.1);
        }

        .threat-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .threat-ip {
            color: #fff;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        .threat-loc {
            color: #888;
            font-size: 0.7rem;
        }

        .duration-val {
            color: var(--accent);
            font-weight: 800;
            font-size: 1rem;
        }

        .duration-label {
            color: #555;
            font-size: 0.6rem;
            text-transform: uppercase;
        }

        .chart-container {
            flex: 1;
            min-height: 0;
        }

        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div class="geo-grid">
        <div class="card map-card">
            <div class="header" style="position: absolute; top: 20px; left: 20px; right: 20px;">
                <div class="title">🔥 ADVERSARIAL HEATWAVE MAP</div>
                <div class="live-indicator">
                    <div class="dot"></div>
                    REAL-TIME THREAT PULSE
                </div>
            </div>
            <div id="map"></div>
        </div>

        <div class="card stats-card">
            <div class="header">
                <div class="title">🚨 ACTIVE VECTORS</div>
                <div id="active-count" style="color: #ff4d00; font-weight: 800; font-size: 1.5rem;">0</div>
            </div>
            <div class="threat-list" id="threat-list"></div>
        </div>

        <div class="card graph-card">
            <div class="header">
                <div class="title">🌊 THREAT PULSE DISTRIBUTION</div>
            </div>
            <div class="chart-container">
                <canvas id="durationChart"></canvas>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://leaflet.github.io/Leaflet.heat/dist/leaflet-heat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([20, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        const heatLayer = L.heatLayer([], {
            radius: 45,
            blur: 35,
            maxZoom: 17,
            gradient: {
                0.0: '#002244', // Deep Blue
                0.3: '#00ccff', // Cyan
                0.5: '#00ff44', // Neon Green 
                0.7: '#ffff00', // Yellow
                0.9: '#ff4d00', // Heatwave Orange
                1.0: '#ffffff'  // Peak Intensity
            }
        }).addTo(map);

        const markers = L.layerGroup().addTo(map);
        const ctx = document.getElementById('durationChart').getContext('2d');
        const durationChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: [],
                datasets: [{
                    label: 'Pulse Intensity',
                    data: [],
                    backgroundColor: 'rgba(255, 77, 0, 0.4)',
                    borderColor: '#ff4d00',
                    borderWidth: 1,
                    borderRadius: 5
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { ticks: { color: '#555', font: { size: 9 } }, grid: { display: false } },
                    y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#555' } }
                },
                plugins: { legend: { display: false } }
            }
        });

        const radiationCanvas = document.createElement('canvas');
        Object.assign(radiationCanvas.style, { position: 'absolute', top: '0', left: '0', width: '100%', height: '100%', pointerEvents: 'none', zIndex: '500' });
        document.querySelector('.map-card').appendChild(radiationCanvas);

        function resizeCanvas() { radiationCanvas.width = radiationCanvas.offsetWidth; radiationCanvas.height = radiationCanvas.offsetHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let activeThreatsForAnim = [];

        function animate() {
            const radCtx = radiationCanvas.getContext('2d');
            radCtx.clearRect(0, 0, radiationCanvas.width, radiationCanvas.height);
            const time = Date.now() / 1000;

            activeThreatsForAnim.forEach(t => {
                const point = map.latLngToContainerPoint([t.lat, t.lng]);
                if (point.x < -100 || point.y < -100 || point.x > radiationCanvas.width + 100 || point.y > radiationCanvas.height + 100) return;

                const intensity = t.intensity || 0.5;
                const baseColor = intensity > 0.8 ? '255, 77, 0' : '0, 212, 255';

                // MULTI-LAYERED HEATWAVE RIPPLES (MATCHING USER IMAGE)
                const rings = 4;
                for (let i = 0; i < rings; i++) {
                    const wavePhase = (time * 0.4 + i / rings) % 1;
                    const radius = 10 + wavePhase * 120 * intensity;
                    const opacity = (1 - wavePhase) * 0.5;

                    radCtx.beginPath();
                    radCtx.arc(point.x, point.y, radius, 0, Math.PI * 2);

                    if (i === rings - 1) {
                        // Outer White Contour Edge
                        radCtx.strokeStyle = `rgba(255, 255, 255, ${opacity * 0.4})`;
                        radCtx.lineWidth = 1;
                    } else {
                        // Color Intensity Layers
                        radCtx.strokeStyle = `rgba(${baseColor}, ${opacity})`;
                        radCtx.lineWidth = 2 + (1 - wavePhase) * 3;
                    }
                    radCtx.stroke();
                }

                // Central Heat Core
                const gradient = radCtx.createRadialGradient(point.x, point.y, 0, point.x, point.y, 25 * intensity);
                gradient.addColorStop(0, `rgba(${baseColor}, 0.6)`);
                gradient.addColorStop(1, `rgba(${baseColor}, 0)`);
                radCtx.fillStyle = gradient;
                radCtx.beginPath();
                radCtx.arc(point.x, point.y, 25 * intensity, 0, Math.PI * 2);
                radCtx.fill();

                // White Peak Node
                radCtx.fillStyle = '#fff';
                radCtx.beginPath();
                radCtx.arc(point.x, point.y, 2, 0, Math.PI * 2);
                radCtx.fill();
            });
            requestAnimationFrame(animate);
        }
        animate();

        async function updateGeoStats() {
            const token = localStorage.getItem('sentinel_token');
            try {
                const response = await fetch('/api/geo/stats', { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await response.json();
                const threats = data.active_threats;
                console.log("DEBUG: Geo Stats Data:", data);

                document.getElementById('active-count').innerText = data.total_active;
                heatLayer.setLatLngs(threats.map(t => [t.lat, t.lng, t.intensity || 0.5]));

                markers.clearLayers();
                threats.forEach(t => {
                    const intensity = t.intensity || 0.5; // FIXED: Changed from 'intensity' to 't.intensity'
                    const marker = L.circleMarker([t.lat, t.lng], {
                        radius: 4, fillColor: '#fff', color: intensity > 0.8 ? '#ff4d00' : '#00d4ff',
                        weight: 2, opacity: 1, fillOpacity: 1
                    }).bindPopup(`<div style="font-family:'Outfit';"><b>${t.ip}</b><br>${t.city}<br>Level: ${Math.round(intensity * 100)}%</div>`);
                    markers.addLayer(marker);
                });

                activeThreatsForAnim = threats;

                const list = document.getElementById('threat-list');
                list.innerHTML = threats.map(t => `
                    <div class="threat-item">
                        <div class="threat-info">
                            <span class="threat-ip">${t.ip}</span>
                            <span class="threat-loc">${t.city}, ${t.country}</span>
                        </div>
                        <div style="text-align:right;">
                            <div class="duration-val">${t.duration}</div>
                            <div class="duration-label">SEC PULSE</div>
                        </div>
                    </div>
                `).join('');

                const sorted = [...threats].sort((a, b) => b.duration - a.duration).slice(0, 10);
                durationChart.data.labels = sorted.map(t => t.city || t.ip.split('.').slice(-2).join('.'));
                durationChart.data.datasets[0].data = sorted.map(t => t.duration);
                durationChart.update();
            } catch (err) { console.error(err); }
        }

        setInterval(updateGeoStats, 3000);
        updateGeoStats();
    </script>
</body>

</html>
